<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">Modular — a quiet surface for dense work</title>
  <desc id="desc">Editorial cover in warm off-white, dark green, and pale green. Large simple headline balances a detailed miniature of the model server configurator.</desc>
  <rect width="1200" height="530" fill="#f8f9f6"/>
  <path d="M58 75H1142M58 484H1142" stroke="#dfe6dc" stroke-width="1.5"/>

  <rect x="58" y="25" width="32" height="32" rx="8" fill="#1f2820"/>
  <rect x="68" y="35" width="12" height="12" rx="2" fill="none" stroke="#def5b6" stroke-width="2"/>
  <text x="104" y="51" fill="#1f2820" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="-1.5">modular.</text>
  <text x="1142" y="46" text-anchor="end" fill="#8d998b" font-family="monospace" font-size="11" letter-spacing="1.2">MODEL SERVER CONFIGURATOR / 01</text>

  <text x="58" y="145" fill="#658b49" font-family="monospace" font-size="12" font-weight="700" letter-spacing="2">THE IDEA</text>
  <text x="54" y="224" fill="#1f2820" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-4">A quiet surface</text>
  <text x="54" y="296" fill="#1f2820" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-4">for dense work<tspan fill="#81a95b">.</tspan></text>
  <text x="58" y="340" fill="#687568" font-family="Arial, Helvetica, sans-serif" font-size="17">A lot of decisions. One clear command.</text>

  <path d="M58 389H494" stroke="#dfe6dc"/>
  <text x="58" y="416" fill="#315a1d" font-family="monospace" font-size="12" font-weight="700">01</text>
  <text x="86" y="416" fill="#687568" font-family="monospace" font-size="12">MODEL</text>
  <text x="180" y="416" fill="#315a1d" font-family="monospace" font-size="12" font-weight="700">02</text>
  <text x="208" y="416" fill="#687568" font-family="monospace" font-size="12">ENGINE</text>
  <text x="308" y="416" fill="#315a1d" font-family="monospace" font-size="12" font-weight="700">03</text>
  <text x="336" y="416" fill="#687568" font-family="monospace" font-size="12">CONFIGURATION</text>
  <text x="58" y="447" fill="#8d998b" font-family="monospace" font-size="10">CONTEXT · QUANTIZATION · PARALLELISM · CACHE · SCHEDULING</text>

  <rect x="567" y="104" width="575" height="347" rx="12" fill="#ffffff" stroke="#dce4d9" stroke-width="1.5"/>
  <text x="588" y="135" fill="#1f2820" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="-.7">modular.</text>
  <text x="1120" y="134" text-anchor="end" fill="#8d998b" font-family="monospace" font-size="10">WORKSPACE / LIVE</text>
  <path d="M588 152H1121" stroke="#edf1eb"/>

  <text x="588" y="181" fill="#719a54" font-family="monospace" font-size="11">01</text>
  <text x="615" y="181" fill="#1f2820" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Model</text>
  <text x="615" y="204" fill="#687568" font-family="Arial, Helvetica, sans-serif" font-size="12">Qwen3 8B</text>
  <path d="M588 220H824" stroke="#edf1eb"/>

  <text x="588" y="250" fill="#719a54" font-family="monospace" font-size="11">02</text>
  <text x="615" y="250" fill="#1f2820" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Engine</text>
  <rect x="615" y="263" width="59" height="26" rx="5" fill="#def5b6" stroke="#c5e6a1"/>
  <text x="644" y="280" text-anchor="middle" fill="#315a1d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">vLLM</text>
  <text x="687" y="280" fill="#8d998b" font-family="Arial, Helvetica, sans-serif" font-size="11">SGLang  TGI</text>
  <path d="M588 306H824" stroke="#edf1eb"/>

  <text x="588" y="336" fill="#719a54" font-family="monospace" font-size="11">03</text>
  <text x="615" y="336" fill="#1f2820" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Configuration</text>
  <text x="615" y="359" fill="#687568" font-family="Arial, Helvetica, sans-serif" font-size="12">1 GPU · 24 GB / GPU</text>
  <text x="615" y="380" fill="#687568" font-family="Arial, Helvetica, sans-serif" font-size="12">8K context · Auto tuning</text>
  <text x="615" y="424" fill="#8d998b" font-family="monospace" font-size="10">MORE SETTINGS  +</text>

  <rect x="843" y="169" width="278" height="258" rx="8" fill="#f7f9f5" stroke="#e3e9df"/>
  <text x="860" y="193" fill="#1f2820" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Your configuration</text>
  <circle cx="1101" cy="188" r="4" fill="#83b85a"/>
  <path d="M860 208H1104" stroke="#dfe6dc"/>
  <text x="860" y="228" fill="#315a1d" font-family="monospace" font-size="10">CLI</text>
  <text x="901" y="228" fill="#8d998b" font-family="monospace" font-size="10">ONE LINE</text>
  <text x="977" y="228" fill="#8d998b" font-family="monospace" font-size="10">DOCKER</text>
  <text x="1041" y="228" fill="#8d998b" font-family="monospace" font-size="10">JSON</text>
  <path d="M860 237H1104" stroke="#dfe6dc"/>
  <text x="860" y="261" fill="#293a2a" font-family="monospace" font-size="11">vllm serve 'Qwen/Qwen3-8B' \</text>
  <text x="860" y="281" fill="#293a2a" font-family="monospace" font-size="11">  --max-model-len 8192 \</text>
  <text x="860" y="301" fill="#293a2a" font-family="monospace" font-size="11">  --tensor-parallel-size 1</text>
  <rect x="860" y="326" width="244" height="33" rx="6" fill="#def5b6"/>
  <text x="982" y="347" text-anchor="middle" fill="#315a1d" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Copy command</text>
  <path d="M860 374H1104" stroke="#dfe6dc"/>
  <text x="860" y="393" fill="#719a54" font-family="monospace" font-size="10">CHECKS</text>
  <text x="860" y="412" fill="#687568" font-family="Arial, Helvetica, sans-serif" font-size="11">No setting conflicts detected.</text>

  <text x="58" y="509" fill="#8d998b" font-family="monospace" font-size="11" letter-spacing=".7">15 CURATED MODELS</text>
  <text x="285" y="509" fill="#8d998b" font-family="monospace" font-size="11" letter-spacing=".7">6 NAMED ENGINES</text>
  <text x="520" y="509" fill="#8d998b" font-family="monospace" font-size="11" letter-spacing=".7">ENGINE-SPECIFIC CONTROLS</text>
  <text x="879" y="509" fill="#315a1d" font-family="monospace" font-size="11" letter-spacing=".7">ONE CLEAR COMMAND  ↗</text>
</svg>
